[package]
name = "presst-bench"
description = "Benchmarks and evaluation harness for presst"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "presst-eval"
path = "src/bin/presst-eval.rs"

[[bin]]
name = "presst-colbench"
path = "src/bin/presst-colbench/main.rs"

[[bench]]
name = "codec"
harness = false

[dependencies]
presst = { workspace = true, features = ["std"] }
presst-train = { workspace = true }
fsst-rs = { workspace = true }
lz4_flex = { workspace = true }
zstd = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
divan = { workspace = true }

[lints]
workspace = true
